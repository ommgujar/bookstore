<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Catalogue – BookNook</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="/">Book<span>Nook</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a class="active" href="/catalogue.html">Catalogue</a>
        <span id="authSlot" style="display:contents"></span>
      </nav>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <h1>Book Catalogue</h1>
      <p style="color:var(--muted);margin:4px 0 0">Search, filter and sort our collection.</p>
    </div>

    <div class="toolbar">
      <input type="search" id="search" placeholder="Search by title or author…" />
      <select id="sort">
        <option value="title">Sort: Title (A–Z)</option>
        <option value="price_asc">Price: Low to High</option>
        <option value="price_desc">Price: High to Low</option>
        <option value="newest">Newest first</option>
      </select>
    </div>
    <div class="chips" id="chips"></div>

    <div class="grid" id="books"><p class="empty">Loading…</p></div>
  </main>

  <footer><div class="container">© 2026 BookNook</div></footer>

  <script src="/js/app.js"></script>
  <script src="/js/catalogue.js"></script>
</body>
</html>
