<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Login – BookNook</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="/">Book<span>Nook</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/catalogue.html">Catalogue</a>
        <span id="authSlot" style="display:contents"></span>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Welcome back</h1>
      <p class="sub">Log in to your BookNook account.</p>
      <div id="msg" class="alert"></div>
      <form id="loginForm" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button class="btn btn-block" type="submit">Log in</button>
      </form>
      <p class="auth-foot">New here? <a href="/register.html">Create an account</a></p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const msg = document.getElementById('msg');
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'alert';
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      if (!email || !password) {
        msg.textContent = 'Please fill in both fields.';
        msg.className = 'alert error';
        return;
      }
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed.');
        location.href = '/catalogue.html';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'alert error';
      }
    });
  </script>
</body>
</html>
