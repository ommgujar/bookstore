<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Register – BookNook</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header class="navbar">
    <div class="container nav-inner">
      <a class="logo" href="/">Book<span>Nook</span></a>
      <button class="nav-toggle" id="navToggle" aria-label="Menu">☰</button>
      <nav class="nav-links" id="navLinks">
        <a href="/">Home</a>
        <a href="/catalogue.html">Catalogue</a>
        <span id="authSlot" style="display:contents"></span>
      </nav>
    </div>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="sub">Join BookNook in less than a minute.</p>
      <div id="msg" class="alert"></div>
      <form id="registerForm" novalidate>
        <div class="field">
          <label for="name">Full name</label>
          <input type="text" id="name" required autocomplete="name" />
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" />
        </div>
        <div class="field">
          <label for="password">Password (min 6 characters)</label>
          <input type="password" id="password" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="confirm">Confirm password</label>
          <input type="password" id="confirm" required autocomplete="new-password" />
        </div>
        <button class="btn btn-block" type="submit">Register</button>
      </form>
      <p class="auth-foot">Already have an account? <a href="/login.html">Log in</a></p>
    </div>
  </div>

  <script src="/js/app.js"></script>
  <script>
    const msg = document.getElementById('msg');
    function fail(text) { msg.textContent = text; msg.className = 'alert error'; }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'alert';
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      if (name.length < 2) return fail('Please enter your name.');
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return fail('Please enter a valid email.');
      if (password.length < 6) return fail('Password must be at least 6 characters.');
      if (password !== confirm) return fail('Passwords do not match.');

      try {
        const res = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, email, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Registration failed.');
        msg.textContent = 'Account created! Redirecting…';
        msg.className = 'alert success';
        setTimeout(() => (location.href = '/catalogue.html'), 800);
      } catch (err) {
        fail(err.message);
      }
    });
  </script>
</body>
</html>
